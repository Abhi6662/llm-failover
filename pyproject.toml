[tool.poetry]
name = "llm-failover"
version = "0.3.0"
description = "OpenAI-compatible client with automatic endpoint failover and telemetry"
authors = ["Abhishek Mandloi <163866821+Abhi6662@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "llm_failover", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
